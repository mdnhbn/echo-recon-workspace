name: Bug report / সমস্যা জানান
description: Report a reproducible dashboard, installer or documentation problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping. English or বাংলা is welcome. Read SECURITY.md for sensitive security reports. Do not include passwords, tokens, private reports or someone else's target data.
  - type: textarea
    id: problem
    attributes:
      label: What happened? / কী সমস্যা হয়েছে?
      description: Explain the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / সমস্যা ঘটানোর ধাপ
      description: Prefer the offline demo, mock data or a local test. No public target scan is needed for a bug report.
      placeholder: |
        1. Open the offline demo
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / পরিবেশ
      options:
        - Kali Linux
        - Other Linux
        - Windows native
        - Windows with WSL
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions / সংস্করণ
      description: OS version, Python version, project release/commit and relevant scanner version. For WSL, include the distribution and where the scanner runs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted error or screenshot / গোপন তথ্য বাদ দেওয়া error বা ছবি
      description: Include only the relevant lines. Remove credentials, personal information and real target evidence before posting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / পাঠানোর আগে
      options:
        - label: I checked existing issues and removed secrets and private target data from this report.
          required: true
