name: Local checks
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - run: |
          python -m unittest discover -s tests -v
      - run: |
          bash -n install.sh run.sh
        if: runner.os == 'Linux'
      - name: Build and inspect Kali/Debian package
        if: runner.os == 'Linux'
        run: bash packaging/build-deb.sh "$RUNNER_TEMP/deb"
      - run: |
          node --check static/app.js
          node --check static/theme.js
          node --check static/help.js
      - name: Parse PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1', 'run.ps1', 'run-wsl.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell parse failed: $file" }
          }
  macos:
    name: macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dashboard dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Check native macOS runtime and platform integration
        run: python -m unittest discover -s tests -v
      - name: Check Bash 3.2-compatible entrypoints and read-only setup plan
        run: |
          /bin/bash -n install.sh run.sh
          python setup_tools_macos.py --plan
          python app.py --version
      - name: Set up all nine backends and verify local identity (no targets)
        if: github.event_name == 'pull_request' && matrix.os == 'macos-15'
        run: python setup_tools_macos.py --install
